{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script type="text/javascript"
            src="{% static 'admin/js/charting_library.standalone.js' %}"></script>
    <script type="text/javascript" src="{% static 'admin/js/bundle.js' %}"></script>
    <script type="text/javascript" src="{% static 'admin/js/tv.js' %}"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
        }

        .layout {
            width: 100%;

            display: grid;
            grid:
                "header header header" auto
                "leftSide body rightSide" 1fr
                "footer footer footer" auto
                / auto 1fr auto;
            gap: 0;
        }

        .header {
            grid-area: header;
            min-height: 50px;
            background: #e0e0e0;
        }

        .leftSide {
            grid-area: leftSide;
            min-width: 300px;
            background: #eee;
        }

        .body {
            grid-area: body;
        }

        .rightSide {
            grid-area: rightSide;
        }

        .footer {
            grid-area: footer;
        }
    </style>
</head>
<body>

<section class="layout">
    <div class="header">

    </div>
    <div class="leftSide">
        <h3>Positions</h3>
        <ul>
            <li>
                URA.ARCA
            </li>
            <li>
                COPX.ARCA
            </li>
            <li>
                MES.GLOBEX
            </li>
        </ul>
    </div>
    <div class="body">
        <div id="tv_chart_container"></div>
    </div>
    <div class="rightSide">4</div>
    <div class="footer">5</div>
</section>

</body>
</html>
