<!DOCTYPE html>
<meta charset="utf-8">
<style>

    body {
        font: 10px sans-serif;
        background: #eee;
    }

    text {
        fill: #000;
    }

    path.candle {
        stroke: #000000;
    }

    path.candle.body {
        stroke-width: 0;
    }

    path.line {
        fill: none;
        stroke: #999;
        stroke-width: 1;
    }

    svg {
        background: #fff;
    }

    .line1 {
        fill: none;
        stroke: #f50;
        stroke-width: 1;
    }

    .line2 {
        fill: none;
        stroke: #55f;
        stroke-width: 1;
    }

    path.candle.up {
        fill: #7fe1ff;
        stroke: #7fe1ff;
        stroke-width: 0;
    }

    path.candle.down {
        fill: #faa6a8;
        stroke: #faa6a8;
        stroke-width: 0;
    }

    path.candle.equal {
        fill: #999;
        stroke: #999;
        stroke-width: 0;
    }

    rect.pane {
        cursor: move;
        fill: none;
        pointer-events: all;
    }

    path.tradearrow {
        stroke: #fff;
    }

    path.tradearrow.buy {
        fill: #009600;
        stroke-width: 0.5;
    }

    path.tradearrow.sell {
        fill: #d00;
        stroke-width: 0.5;
    }

    .indicator-plot path.line {
        fill: none;
        stroke-width: 1;
    }

    .ma-0 path.line {
        stroke: #1f77b4;
    }

    .ma-1 path.line {
        stroke: #aec7e8;
    }


    path.macd {
        stroke: #0000AA;
    }

    path.signal {
        stroke: #FF9999;
    }

    path.zero {
        stroke: #BBBBBB;
        stroke-dasharray: 0;
        stroke-opacity: 0.5;
    }

    path.difference {
        fill: #BBBBBB;
        opacity: 0.5;
    }


</style>
<body>
<script src="http://d3js.org/d3.v4.min.js"></script>
<script src="http://techanjs.org/techan.min.js"></script>
<script>

    var margin = {top: 20, right: 20, bottom: 30, left: 50},
            width = 2000 - margin.left - margin.right,
            height = 500 - margin.top - margin.bottom;

    var parseDate = d3.timeParse('%Y-%m-%d %H:%M:%S');
    var dateFormat = d3.timeFormat('%Y-%m-%d %H:%M:%S');
    var valueFormat = d3.format(',.2f');


    var dim = {
        width: 2000, height: 500,
        margin: { top: 20, right: 50, bottom: 30, left: 50 },
        ohlc: { height: 305 },
        indicator: { height: 65, padding: 5 }
    };
    dim.plot = {
        width: dim.width - dim.margin.left - dim.margin.right,
        height: dim.height - dim.margin.top - dim.margin.bottom
    };
    dim.indicator.top = dim.ohlc.height+dim.indicator.padding;
    dim.indicator.bottom = dim.indicator.top+dim.indicator.height+dim.indicator.padding;

    var indicatorTop = d3.scaleLinear()
            .range([dim.indicator.top, dim.indicator.bottom]);


    var x = techan.scale.financetime().range([0, width]);

    var y = d3.scaleLinear().range([height, 0]);

//    var zoom = d3.zoom().on("zoom", zoomed);

    var zoomableInit;

    var candlestick = techan.plot.candlestick()
            .xScale(x)
            .yScale(y);

    var heikinashi = techan.plot.heikinashi()
            .xScale(x)
            .yScale(y);

    var heikinashiIndicator = techan.indicator.heikinashi();

    var close = techan.plot.close()
            .xScale(x)
            .yScale(y);

    // define the line
    var valueline1 = d3.line()
        .x(function(d) { return x(d.date); })
        .y(function(d) { return y(d.mv1); })
        .curve(d3.curveMonotoneX);

    // define the line
    var valueline2 = d3.line()
        .x(function(d) { return x(d.date); })
        .y(function(d) { return y(d.mv2); })
        .curve(d3.curveMonotoneX);

    var tradearrow = techan.plot.tradearrow()
            .xScale(x)
            .yScale(y)
            .orient(function(d) { return d.type.startsWith("buy") ? "up" : "down"; })
            .on("mouseenter", enter)
            .on("mouseout", out);

    var xAxis = d3.axisBottom(x);

    var yAxis = d3.axisLeft(y);


    var sma0 = techan.plot.sma()
            .xScale(x)
            .yScale(y);

    var sma1 = techan.plot.sma()
            .xScale(x)
            .yScale(y);

    var macdScale = d3.scaleLinear()
            .range([indicatorTop(0)+dim.indicator.height, indicatorTop(0)]);

    var rsiScale = macdScale.copy()
            .range([indicatorTop(1)+dim.indicator.height, indicatorTop(1)]);

    var macd = techan.plot.macd()
            .xScale(x)
            .yScale(macdScale);

    var macdAxis = d3.axisRight(macdScale)
            .ticks(3);

    var macdAnnotation = techan.plot.axisannotation()
            .axis(macdAxis)
            .orient("right")
            .format(d3.format(',.2f'))
            .translate([x(1), 0]);

    var macdAxisLeft = d3.axisLeft(macdScale)
            .ticks(3);

    var macdAnnotationLeft = techan.plot.axisannotation()
            .axis(macdAxisLeft)
            .orient("left")
            .format(d3.format(',.2f'));


    var svg = d3.select("body").append("svg")
            .attr("width", dim.width)
            .attr("height", dim.height)
            .append("g")
            .attr("transform", "translate(" + dim.margin.left + "," + dim.margin.top + ")");
//            .call(zoom);


    function zoomed() {
      svg.select(".x.axis").call(xAxis);
      svg.select(".y.axis").call(yAxis);
    }



    var valueText = svg.append('text')
            .style("text-anchor", "end")
            .attr("class", "coords")
            .attr("x", width - 5)
            .attr("y", 15);

    svg.append("clipPath")
            .attr("id", "clip")
        .append("rect")
            .attr("x", 0)
            .attr("y", y(1))
            .attr("width", width)
            .attr("height", y(0) - y(1));

    svg.append("g")
            .attr("class", "candlestick")
            .attr("clip-path", "url(#clip)");

    svg.append("g")
            .attr("class", "x axis")
            .attr("transform", "translate(0," + height + ")");

    svg.append("g")
            .attr("class", "y axis")
        .append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", 6)
            .attr("dy", ".71em")
            .style("text-anchor", "end")
            .text("Price ($)");

//    svg.append("rect")
//            .attr("class", "pane")
//            .attr("width", width)
//            .attr("height", height);
////            .call(zoom);



    var techanIntradayTimeInit;

    d3.csv("data.csv", function(error, data) {

//        var accessor = candlestick.accessor();
        var accessor = close.accessor();

        data = data.map(function(d) {
            return {
                date: parseDate(d.Date),
                open: +d.Open,
                high: +d.High,
                low: +d.Low,
                close: +d.Close,
                volume: 10
            };
        }).sort(function(a, b) { return d3.ascending(accessor.d(a), accessor.d(b)); });

//        var macdData = techan.indicator.macd()(data);
//        macdScale.domain(techan.scale.plot.macd(macdData).domain());

//        svg.select("g.macd .indicator-plot").datum(macdData).call(macd);

        svg.append("g")
                .attr("class", "heikinashi");

        svg.append("g")
                .attr("class", "candlestick");

        svg.append("g")
                .attr("class", "close");

        svg.append("g").attr("class", "tradearrow");

        svg.append("g")
                .attr("class", "x axis")
                .attr("transform", "translate(0," + height + ")");

        svg.append("g")
                .attr("class", "y axis")
                .append("text")
                .attr("transform", "rotate(-90)")
                .attr("y", 6)
                .attr("dy", ".71em")
                .style("text-anchor", "end")
                .text("Price ($)");

//        techanIntradayTimeInit = x.domain(data.map(accessor.d)).zoomable().copy();

        var dataset = [];
        d3.csv("trades.csv", function(trades_data) {
            dataset = trades_data.map(function(d) {
                return {
                    date: parseDate(d.Date),
                    type: d.Direction,
                    price: d.Price
                };
            });
            console.log(dataset);
            draw(data, dataset);
        });

    });

//    function zoomed() {
//        var transform = d3.event.transform;
//        techanTime.zoomable().domain(transform.rescaleX(techanTimeInit).domain());
//        xAxis.scale(transform.rescaleX(x));
////        draw();
//    }

    function draw(data, trades) {
        var heikinashiData = heikinashiIndicator(data);
        x.domain(data.map(heikinashi.accessor().d));
        y.domain(techan.scale.plot.ohlc(heikinashiData, heikinashi.accessor()).domain());

        svg.selectAll("g.heikinashi")
                .datum(heikinashiData)
                .call(heikinashi)
                .call(d3.zoom().on("zoom", function () {
                    svg.attr("transform", d3.event.transform)
                }));

        svg.selectAll("g.tradearrow").datum(trades).call(tradearrow);

//        svg.append("path")
//            .datum(data) // 10. Binds data to the line
//            .attr("class", "line1") // Assign a class for styling
//            .attr("d", valueline1); // 11. Calls the line generator
//
//        svg.append("path")
//            .datum(data) // 10. Binds data to the line
//            .attr("class", "line2") // Assign a class for styling
//            .attr("d", valueline2); // 11. Calls the line generator




        svg.selectAll("g.x.axis").call(xAxis);
        svg.selectAll("g.y.axis").call(yAxis);
    }

    function enter(d) {
        valueText.style("display", "inline");
        refreshText(d);
    }

    function out() {
        valueText.style("display", "none");
    }

    function refreshText(d) {
        valueText.text("Trade: " + dateFormat(d.date) + ", " + d.type + ", " + valueFormat(d.price));
    }

</script>
